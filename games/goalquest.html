<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Goal Quest — Chart Your Trails</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;0,9..144,900;1,9..144,600&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --forest:#2c3a2a;
    --forest-deep:#212c20;
    --moss:#6f8a5a;
    --moss-dim:#8fa87c;
    --clay:#a85a36;
    --clay-bright:#c06a3f;
    --sand:#e8ddc2;
    --parchment:#f2ead6;
    --bark:#3c332a;
    --bark-soft:#6b6052;
    --gold:#bd9430;
    --line:rgba(60,51,42,0.18);
    --shadow: 0 4px 14px rgba(44,58,42,0.14);
    --radius: 4px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  html, body{overflow-x:hidden; max-width:100%;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;}
  }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at top left, rgba(111,138,90,0.10), transparent 55%),
      radial-gradient(ellipse at bottom right, rgba(168,90,54,0.08), transparent 50%),
      var(--parchment);
    background-attachment:fixed;
    color:var(--bark);
    font-family:'Archivo', sans-serif;
    position:relative;
  }

  /* subtle topo-line texture */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:0.5;
    background-image:
      repeating-radial-gradient(circle at 12% 18%, transparent 0, transparent 38px, rgba(60,51,42,0.035) 39px, transparent 40px, transparent 78px),
      repeating-radial-gradient(circle at 85% 72%, transparent 0, transparent 46px, rgba(60,51,42,0.03) 47px, transparent 48px, transparent 92px);
    z-index:0;
  }

  #app{position:relative; z-index:1; max-width:1080px; margin:0 auto; padding:28px 20px 80px;}

  h1,h2,h3{font-family:'Fraunces', serif; margin:0; color:var(--forest-deep);}

  a, button{font-family:inherit;}

  /* ---------- Header ---------- */
  .site-header{
    display:flex; align-items:center; justify-content:space-between;
    padding:6px 4px 26px;
    border-bottom:1px solid var(--line);
    margin-bottom:30px;
    flex-wrap:wrap; gap:14px;
  }
  .brand{display:flex; align-items:center; gap:12px; cursor:pointer; background:none; border:none; padding:0;}
  .brand-mark{width:40px; height:40px; flex-shrink:0;}
  .brand-text{display:flex; flex-direction:column; text-align:left;}
  .brand-text .title{font-size:1.5rem; font-weight:700; letter-spacing:0.01em; line-height:1;}
  .brand-text .sub{font-size:0.72rem; letter-spacing:0.14em; text-transform:uppercase; color:var(--bark-soft); margin-top:4px;}

  .nav-actions{display:flex; gap:10px;}
  .pill-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:transparent;
    border:1.5px solid var(--forest);
    color:var(--forest-deep);
    padding:9px 16px;
    border-radius:999px;
    font-size:0.86rem;
    font-weight:600;
    cursor:pointer;
    transition:background .18s ease, color .18s ease, transform .18s ease;
  }
  .pill-btn:hover{background:var(--forest); color:var(--parchment); transform:translateY(-1px);}
  .pill-btn:focus-visible, button:focus-visible, [tabindex]:focus-visible{
    outline:3px solid var(--clay-bright); outline-offset:2px;
  }
  .pill-btn svg{width:16px; height:16px;}

  /* ---------- Home: gallery ---------- */
  .gallery-intro{max-width:640px; margin-bottom:8px;}
  .gallery-intro .eyebrow{
    font-size:0.72rem; letter-spacing:0.18em; text-transform:uppercase; color:var(--clay); font-weight:700; margin-bottom:8px; display:block;
  }
  .gallery-intro h2{font-size:2rem; line-height:1.15; font-weight:600;}
  .gallery-intro p{color:var(--bark-soft); font-size:1rem; line-height:1.55; margin-top:12px;}

  .filter-row{display:flex; flex-wrap:wrap; gap:8px; margin:26px 0 22px;}
  .filter-chip{
    border:1px solid var(--line);
    background:rgba(255,255,255,0.35);
    color:var(--bark);
    padding:7px 14px;
    border-radius:999px;
    font-size:0.82rem;
    font-weight:600;
    cursor:pointer;
    transition:all .16s ease;
  }
  .filter-chip.active, .filter-chip:hover{
    background:var(--moss); border-color:var(--moss); color:#fff;
  }

  .goal-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(230px, 1fr));
    gap:22px 18px;
    margin-top:8px;
  }
  .goal-card{
    background:rgba(255,255,255,0.55);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:20px 18px 18px;
    cursor:pointer;
    position:relative;
    transition:transform .2s ease, box-shadow .2s ease, background .2s ease;
    display:flex; flex-direction:column; gap:12px;
    text-align:left;
  }
  .goal-grid > .goal-card:nth-child(3n+2){ transform:translateY(10px); }
  .goal-grid > .goal-card:nth-child(3n+2):hover{ transform:translateY(6px); }
  .goal-card:hover{ box-shadow:var(--shadow); background:rgba(255,255,255,0.78); transform:translateY(-3px); }
  .goal-grid > .goal-card:nth-child(3n+2):hover{ transform:translateY(7px); }

  .goal-card .top-row{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .cat-icon{
    width:34px; height:34px; flex-shrink:0;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--sand);
    border:1px solid var(--line);
  }
  .cat-icon svg{width:18px; height:18px; stroke:var(--forest-deep);}

  .goal-card h3{font-size:1.12rem; font-weight:600; line-height:1.25;}
  .goal-card .cat-tag{
    font-size:0.68rem; letter-spacing:0.1em; text-transform:uppercase; font-weight:700; color:var(--clay);
  }
  .goal-card .blurb{font-size:0.85rem; color:var(--bark-soft); line-height:1.45; flex-grow:1;}

  .progress-track{
    height:6px; border-radius:3px; background:var(--sand); overflow:hidden; margin-top:4px;
  }
  .progress-fill{height:100%; background:linear-gradient(90deg, var(--moss), var(--gold)); border-radius:3px; transition:width .4s ease;}
  .progress-label{font-size:0.72rem; color:var(--bark-soft); display:flex; justify-content:space-between; margin-top:2px;}

  .empty-state{
    padding:40px 20px; text-align:center; color:var(--bark-soft); border:1px dashed var(--line); border-radius:var(--radius); grid-column:1/-1;
  }

  /* ---------- Detail view ---------- */
  .back-link{
    display:inline-flex; align-items:center; gap:6px;
    background:none; border:none; cursor:pointer;
    font-size:0.86rem; font-weight:600; color:var(--bark-soft);
    padding:4px 0; margin-bottom:18px;
  }
  .back-link:hover{color:var(--forest-deep);}
  .back-link svg{width:14px; height:14px;}

  .detail-header{
    display:flex; gap:18px; align-items:flex-start; margin-bottom:8px; flex-wrap:wrap;
  }
  .detail-header .cat-icon{width:52px; height:52px;}
  .detail-header .cat-icon svg{width:26px; height:26px;}
  .detail-title h2{font-size:1.9rem; font-weight:600;}
  .detail-title .cat-tag{font-size:0.72rem; letter-spacing:0.12em; text-transform:uppercase; font-weight:700; color:var(--clay); display:block; margin-bottom:6px;}
  .detail-blurb{color:var(--bark-soft); max-width:560px; line-height:1.55; margin-top:10px;}

  .detail-progress-summary{
    display:flex; align-items:center; gap:12px; margin:22px 0 6px;
    font-size:0.86rem; color:var(--bark-soft); font-weight:600;
  }
  .detail-progress-summary .progress-track{flex-grow:1; max-width:260px; height:8px;}

  .trail-wrap{margin-top:18px; max-width:520px;}
  .trail-item{display:flex; gap:16px; align-items:stretch;}
  .wp-col{display:flex; flex-direction:column; align-items:center; width:38px; flex-shrink:0;}
  .wp-marker{
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    background:var(--parchment); border:1.6px solid var(--line);
    font-family:'Fraunces', serif; font-weight:700; font-size:0.85rem; color:var(--bark-soft);
    transition:background .18s ease, border-color .18s ease, transform .18s ease;
  }
  .wp-marker svg{width:16px; height:16px; stroke:#3c332a;}
  .wp-marker.done{background:var(--gold); border-color:var(--gold);}
  .wp-marker.current{border-color:var(--clay-bright); border-width:2.2px; color:var(--clay-bright);}
  .wp-connector{width:2px; flex-grow:1; min-height:22px; background:var(--line); margin:2px 0;}
  .wp-connector.filled{background:var(--moss); width:3px;}

  .trail-item{cursor:pointer; outline-offset:4px;}
  .trail-item:focus-visible{outline:3px solid var(--clay-bright); border-radius:4px;}
  .trail-item:hover .wp-marker{transform:scale(1.06);}

  .wp-content{min-width:0; flex-grow:1; padding-bottom:26px;}
  .wp-title{
    font-family:'Archivo', sans-serif; font-weight:600; font-size:0.98rem; line-height:1.4;
    color:var(--bark); word-wrap:break-word; overflow-wrap:break-word; padding-top:6px;
  }
  .trail-item.is-done .wp-title{color:var(--bark-soft); text-decoration:line-through; text-decoration-color:var(--moss-dim); text-decoration-thickness:1.5px;}
  .wp-hint{font-family:'Archivo', sans-serif; font-size:0.76rem; font-style:italic; color:var(--clay-bright); margin-top:4px;}

  .complete-banner{
    margin-top:26px; padding:20px 22px; border-radius:var(--radius);
    background:linear-gradient(120deg, rgba(189,148,48,0.16), rgba(111,138,90,0.14));
    border:1px solid rgba(189,148,48,0.4);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .complete-banner svg{width:38px; height:38px; flex-shrink:0;}
  .complete-banner strong{display:block; font-family:'Fraunces', serif; font-size:1.05rem; margin-bottom:2px;}
  .complete-banner span{font-size:0.86rem; color:var(--bark-soft);}

  /* ---------- Badges ---------- */
  .badges-header{margin-bottom:26px;}
  .badges-header h2{font-size:1.9rem; font-weight:600; margin-bottom:8px;}
  .badges-header p{color:var(--bark-soft); max-width:560px; line-height:1.5;}

  .badge-count{
    display:inline-block; margin-top:12px; font-size:0.82rem; font-weight:700; color:var(--forest-deep);
    background:var(--sand); padding:6px 14px; border-radius:999px;
  }

  .badge-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:22px 16px; margin-top:14px;
  }
  .badge{
    display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px;
    padding:16px 10px 14px;
  }
  .seal{
    width:84px; height:84px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    position:relative;
    background:radial-gradient(circle at 35% 30%, #d3a94a, #a5761f 65%, #7c5814 100%);
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.35), inset 0 -4px 8px rgba(0,0,0,0.25), 0 3px 8px rgba(0,0,0,0.18);
    border:2px solid rgba(124,88,20,0.5);
  }
  .seal svg{width:36px; height:36px; stroke:#3c2e10; fill:none;}
  .seal.locked{
    background:var(--sand);
    box-shadow: inset 0 2px 4px rgba(255,255,255,0.4), inset 0 -3px 6px rgba(60,51,42,0.12);
    border:2px dashed var(--line);
    opacity:0.75;
  }
  .seal.locked svg{stroke:var(--bark-soft); opacity:0.55;}
  .badge-name{font-family:'Fraunces', serif; font-weight:600; font-size:0.88rem; line-height:1.25;}
  .badge.locked .badge-name{color:var(--bark-soft);}
  .badge-desc{font-size:0.72rem; color:var(--bark-soft); line-height:1.3;}

  footer.note{
    margin-top:60px; text-align:center; font-size:0.76rem; color:var(--bark-soft); padding-top:18px; border-top:1px solid var(--line);
  }

  /* ---------- Manage dashboard ---------- */
  .manage-header{margin-bottom:22px;}
  .manage-header h2{font-size:1.8rem; font-weight:600; margin-bottom:8px;}
  .manage-header p{color:var(--bark-soft); max-width:560px; line-height:1.5; margin-bottom:16px;}

  .manage-list{display:flex; flex-direction:column; gap:10px;}
  .manage-row{
    display:flex; align-items:center; gap:14px;
    background:rgba(255,255,255,0.55);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:12px 16px;
  }
  .manage-row-icon{width:38px; height:38px; flex-shrink:0;}
  .manage-row-icon svg{width:18px; height:18px;}
  .manage-row-info{display:flex; flex-direction:column; gap:2px; flex-grow:1; min-width:0;}
  .manage-row-info strong{font-family:'Fraunces', serif; font-size:1rem; font-weight:600;}
  .manage-row-info span{font-size:0.78rem; color:var(--bark-soft);}
  .manage-row-actions{display:flex; gap:8px; flex-shrink:0;}

  .btn-small{
    display:inline-flex; align-items:center; gap:6px;
    background:transparent; border:1.4px solid var(--line); color:var(--forest-deep);
    padding:7px 12px; border-radius:6px; font-size:0.8rem; font-weight:600; cursor:pointer;
    transition:background .16s ease, border-color .16s ease;
  }
  .btn-small:hover{background:var(--sand); border-color:var(--bark-soft);}
  .btn-small svg{width:14px; height:14px;}
  .btn-danger{color:var(--clay);}
  .btn-danger:hover{background:rgba(168,90,54,0.12); border-color:var(--clay);}
  .btn-add{margin-top:10px;}

  .goal-form{
    background:rgba(255,255,255,0.55);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:22px 22px 20px;
    max-width:560px;
    display:flex; flex-direction:column; gap:16px;
  }
  .form-label{
    display:flex; flex-direction:column; gap:6px;
    font-size:0.84rem; font-weight:600; color:var(--forest-deep);
  }
  .form-hint{font-weight:500; color:var(--bark-soft); font-size:0.76rem;}
  .text-input{
    font-family:'Archivo', sans-serif; font-size:0.92rem; font-weight:400; color:var(--bark);
    border:1.4px solid var(--line); border-radius:6px; padding:9px 11px;
    background:rgba(255,255,255,0.7);
    resize:vertical;
  }
  .text-input:focus-visible{outline:2.5px solid var(--clay-bright); outline-offset:1px;}

  .new-cat-panel{
    display:flex; flex-direction:column; gap:10px;
    padding:14px; border:1px dashed var(--line); border-radius:6px;
    background:rgba(232,221,194,0.35); margin-top:-6px;
  }
  .icon-picker{display:flex; gap:8px; flex-wrap:wrap;}
  .icon-swatch{
    width:38px; height:38px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:var(--sand); border:1.6px solid var(--line); cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
  }
  .icon-swatch svg{width:18px; height:18px; stroke:var(--forest-deep);}
  .icon-swatch.selected{border-color:var(--clay-bright); background:#fff; border-width:2.2px;}

  .subgoal-edit-list{display:flex; flex-direction:column; gap:8px;}
  .subgoal-edit-row{display:flex; align-items:center; gap:8px;}
  .subgoal-num{
    width:22px; flex-shrink:0; text-align:center; font-family:'Fraunces', serif;
    font-weight:700; font-size:0.82rem; color:var(--bark-soft);
  }
  .subgoal-edit-row .text-input{flex-grow:1; min-width:0;}
  .subgoal-edit-actions{display:flex; gap:4px; flex-shrink:0;}
  .icon-btn{
    width:30px; height:30px; flex-shrink:0;
    display:flex; align-items:center; justify-content:center;
    border:1.4px solid var(--line); border-radius:6px; background:rgba(255,255,255,0.6); cursor:pointer;
    transition:background .15s ease;
  }
  .icon-btn svg{width:14px; height:14px; stroke:var(--forest-deep);}
  .icon-btn:hover:not(:disabled){background:var(--sand);}
  .icon-btn:disabled{opacity:0.35; cursor:default;}

  .form-actions{display:flex; align-items:center; gap:16px; margin-top:4px;}

  @media (max-width: 480px){
    .brand-text .title{font-size:1.25rem;}
    .gallery-intro h2{font-size:1.55rem;}
    .detail-title h2{font-size:1.5rem;}
    .manage-row{flex-wrap:wrap;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){

  /* ============ ICONS (category line-icons, hand-simplified) ============ */
  const ICONS = {
    creative: `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20L14 10M14 10L20 4C20.5 6 19 8.5 17.5 10C16 11.5 13.5 13 12 13.5" /><path d="M12 13.5C10.5 14 8 14.5 6.5 14C7 15.5 8 16 10 16.5" /><circle cx="14" cy="10" r="0.6" fill="currentColor"/></svg>`,

  const CHECK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>`;
  const BACK_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>`;
  const MARKER_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-11.5A7 7 0 0 0 5 9.5C5 14.5 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.2"/></svg>`;

  const PLUS_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`;

  const UP_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>`;
  const DOWN_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>`;

  /* ============ DATA ============ */
  const DEFAULT_CATS = {

  const DEFAULT_GOALS = [

     subgoals:['Choose what you want to grow','Prepare the soil and plant','Care for it through first sprouts','Manage a pest or problem','Harvest your first crop','Grow something from seed to seed','Expand into a second growing season','Grow enough to share or preserve']},

    {id:'climb', title:'Climb a Mountain', category:'endurance', badgeName:'The Summiteer',
     blurb:'Train up from a local trail to a real summit attempt.',
     subgoals:['Hike a local trail','Hike a route with real elevation gain','Learn basic gear and layering','Do a longer training hike','Learn basic navigation and route reading','Attempt a moderate peak','Push through a weather or fatigue setback','Summit your target mountain']}
  ];

  /* ============ CUSTOM GOALS / CATEGORIES STORAGE ============ */
  const GOALS_KEY = 'goalquest-goals-v2';
  const CATS_KEY = 'goalquest-cats-v2';

  function loadGoals(){
    try{
      const raw = localStorage.getItem(GOALS_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ /* ignore corrupt data */ }
    return DEFAULT_GOALS.map(g => ({...g, subgoals:[...g.subgoals]}));
  }
  function saveGoals(){
    try{ localStorage.setItem(GOALS_KEY, JSON.stringify(GOALS)); }
    catch(e){ /* storage unavailable, continue silently */ }
  }

  function loadCats(){
    try{
      const raw = localStorage.getItem(CATS_KEY);
      if(raw){
        const parsed = JSON.parse(raw);
        return {cats: parsed.cats || {}, shapes: parsed.shapes || {}};
      }
    }catch(e){ /* ignore corrupt data */ }
    return {cats: {...DEFAULT_CATS}, shapes: {}};
  }
  function saveCats(){
    try{ localStorage.setItem(CATS_KEY, JSON.stringify({cats: CATS, shapes: customCatShapes})); }
    catch(e){ /* storage unavailable, continue silently */ }
  }

  let GOALS = loadGoals();
  const catsData = loadCats();
  let CATS = catsData.cats;
  let customCatShapes = catsData.shapes;

  function slugify(str){
    let base = str.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    if(!base) base = 'item';
    return base;
  }
  function uniqueId(base, existingIds){
    let id = base, n = 2;
    while(existingIds.includes(id)){ id = `${base}-${n}`; n++; }
    return id;
  }

  const META_BADGES = [
    {id:'first-steps', name:'First Steps', desc:'Complete your first waypoint.', test:s => s.totalCompleted >= 1},
    {id:'trailblazer', name:'Trailblazer', desc:'Finish your first full trail.', test:s => s.completedGoals >= 1},
    {id:'wanderer', name:'The Wanderer', desc:'Start 3 different trails.', test:s => s.startedGoals >= 3},
    {id:'summit-collector', name:'Summit Collector', desc:'Finish 3 full trails.', test:s => s.completedGoals >= 3},
    {id:'renaissance', name:'Renaissance Wanderer', desc:'Finish trails in 3+ categories.', test:s => s.categoriesCompleted >= 3},
    {id:'full-compass', name:'Full Compass', desc:'Complete every trail.', test:s => s.completedGoals >= GOALS.length},
  ];

  /* ============ STATE / STORAGE ============ */
  const STORAGE_KEY = 'goalquest-v1';

  function loadState(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      if(raw) return JSON.parse(raw);
    }catch(e){ /* ignore corrupt state */ }
    const progress = {};
    GOALS.forEach(g => progress[g.id] = new Array(g.subgoals.length).fill(false));
    return {progress};
  }

  let state = loadState();
  // ensure any goal shape changes are covered
  GOALS.forEach(g => {
    if(!state.progress[g.id]) state.progress[g.id] = new Array(g.subgoals.length).fill(false);
  });

  function saveState(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ /* storage unavailable, continue silently */ }
  }

  function goalProgress(goal){
    const arr = state.progress[goal.id];
    const done = arr.filter(Boolean).length;
    return {done, total: goal.subgoals.length, pct: Math.round((done/goal.subgoals.length)*100)};
  }

  function computeBadgeStats(){
    let totalCompleted = 0, startedGoals = 0, completedGoals = 0;
    const catsCompleted = new Set();
    GOALS.forEach(g => {
      const {done, total} = goalProgress(g);
      totalCompleted += done;
      if(done > 0) startedGoals++;
      if(done === total){ completedGoals++; catsCompleted.add(g.category); }
    });
    return {totalCompleted, startedGoals, completedGoals, categoriesCompleted: catsCompleted.size};
  }

  function earnedMetaBadges(){
    const stats = computeBadgeStats();
    return META_BADGES.map(b => ({...b, earned: b.test(stats)}));
  }

  /* ============ ROUTING ============ */
  let route = {view:'home', goalId:null};
  let activeFilter = 'all';
  let draft = null; // goal currently being created/edited in the Manage view

  const app = document.getElementById('app');

  function go(newRoute){
    route = newRoute;
    draft = null;
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
    render();
  }

  function blankDraft(){
    const firstCat = Object.keys(CATS)[0] || 'creative';
    return {
      originalId: null,
      title: '',
      category: firstCat,
      blurb: '',
      badgeName: '',
      subgoals: [''],
      newCatLabel: '',
      newCatShape: ICON_SHAPES[0].key
    };
  }

  function draftFromGoal(goal){
    return {
      originalId: goal.id,
      title: goal.title,
      category: goal.category,
      blurb: goal.blurb,
      badgeName: goal.badgeName,
      subgoals: [...goal.subgoals],
      newCatLabel: '',
      newCatShape: ICON_SHAPES[0].key
    };
  }

  /* ============ RENDER: HEADER ============ */
  function renderHeader(){
    return `
      <header class="site-header">
        <button class="brand" data-action="go-home" aria-label="Go to trail gallery">
          <svg class="brand-mark" viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="18.5" stroke="#3c332a" stroke-width="1.3" fill="#e8ddc2"/>
            <path d="M8 24L15 12L20 20L25 9L32 24" stroke="#6f8a5a" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
            <circle cx="20" cy="20" r="1.6" fill="#a85a36"/>
          </svg>
          <span class="brand-text">
            <span class="title">Goal Quest</span>
            <span class="sub">Chart your trails</span>
          </span>
        </button>
        <div class="nav-actions">
          <a class="pill-btn" href="/index.html">
            ${BACK_ICON}
            BTG
          </a>
          <button class="pill-btn" data-action="go-manage">
            ${GEAR_ICON}
            Manage
          </button>
          <button class="pill-btn" data-action="go-badges">
            ${MARKER_ICON}
            Badges
          </button>
        </div>
      </header>
    `;
  }

  /* ============ RENDER: HOME ============ */
  function renderHome(){
    const cats = ['all', ...Object.keys(CATS)];
    const filtered = activeFilter === 'all' ? GOALS : GOALS.filter(g => g.category === activeFilter);

    const cards = filtered.map(g => {
      const {done, total, pct} = goalProgress(g);
      return `
        <div class="goal-card" tabindex="0" role="button" data-action="open-goal" data-goal="${g.id}" aria-label="Open trail: ${escapeXml(g.title)}, ${pct} percent complete">
          <div class="top-row">
            <div class="cat-icon">${iconFor(g.category)}</div>
          </div>
          <div>
            <span class="cat-tag">${escapeXml(CATS[g.category] ? CATS[g.category].label : g.category)}</span>
            <h3>${escapeXml(g.title)}</h3>
          </div>
          <p class="blurb">${escapeXml(g.blurb)}</p>
          <div>
            <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
            <div class="progress-label"><span>${done}/${total} waypoints</span><span>${pct}%</span></div>
          </div>
        </div>
      `;
    }).join('');

    return `
      <div class="gallery-intro">
        <span class="eyebrow">Trailhead</span>
        <h2>Pick a trail. Start wherever you already are.</h2>
        <p>Every big goal is really a path of smaller waypoints. Browse the trails below, jump in at whatever point fits you, and mark off what you've already covered.</p>
      </div>
      <div class="filter-row">
        ${cats.map(c => `<button class="filter-chip ${activeFilter===c?'active':''}" data-action="filter" data-cat="${c}">${c==='all' ? 'All trails' : CATS[c].label}</button>`).join('')}
      </div>
      <div class="goal-grid">
        ${filtered.length ? cards : `<div class="empty-state">No trails in this category yet.</div>`}
      </div>
      <footer class="note">Your progress is saved right in this browser — no account needed.</footer>
    `;
  }

  /* ============ RENDER: DETAIL ============ */
  function renderDetail(goalId){
    const goal = GOALS.find(g => g.id === goalId);
    if(!goal) { go({view:'home', goalId:null}); return ''; }
    const {done, total, pct} = goalProgress(goal);
    const arr = state.progress[goal.id];

    const lastDoneIdx = arr.reduce((acc, v, i) => v ? i : acc, -1);

    const trailItems = goal.subgoals.map((title, i) => {
      const isDone = arr[i];
      const isCurrent = i === lastDoneIdx + 1 && !isDone;
      const isLast = i === goal.subgoals.length - 1;
      const connectorFilled = arr[i+1]; // the stretch leading into the next completed waypoint
      return `
        <div class="trail-item ${isDone ? 'is-done' : ''}" tabindex="0" role="button"
             aria-pressed="${isDone}"
             aria-label="${escapeXml(title)}, ${isDone ? 'completed' : 'not completed'}"
             data-action="toggle-sub" data-goal="${goal.id}" data-idx="${i}">
          <div class="wp-col">
            <div class="wp-marker ${isDone ? 'done' : ''} ${isCurrent ? 'current' : ''}">
              ${isDone ? CHECK_ICON : (i+1)}
            </div>
            ${!isLast ? `<div class="wp-connector ${connectorFilled ? 'filled' : ''}"></div>` : ''}
          </div>
          <div class="wp-content">
            <div class="wp-title">${escapeXml(title)}</div>
            ${isCurrent ? `<div class="wp-hint">you are here</div>` : ''}
          </div>
        </div>
      `;
    }).join('');

    const completeBanner = (done === total) ? `
      <div class="complete-banner">
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="1.6"><circle cx="12" cy="9" r="6"/><path d="M9 14.5L7 21l5-3 5 3-2-6.5"/></svg>
        <div>
          <strong>Trail complete — you've earned "${escapeXml(goal.badgeName)}"</strong>
          <span>Check your badge collection to see it alongside the rest of your journeys.</span>
        </div>
      </div>
    ` : '';

    return `
      <button class="back-link" data-action="go-home">${BACK_ICON} All trails</button>
      <div class="detail-header">
        <div class="cat-icon">${iconFor(goal.category)}</div>
        <div class="detail-title">
          <span class="cat-tag">${escapeXml(CATS[goal.category] ? CATS[goal.category].label : goal.category)}</span>
          <h2>${escapeXml(goal.title)}</h2>
          <p class="detail-blurb">${escapeXml(goal.blurb)}</p>
        </div>
      </div>
      <div class="detail-progress-summary">
        <span>${done}/${total} waypoints</span>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span>${pct}%</span>
      </div>
      ${completeBanner}
      <div class="trail-wrap">
        ${trailItems}
      </div>
    `;
  }

  function escapeXml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  /* ============ RENDER: MANAGE ============ */
  function renderManage(){
    if(draft){
      return renderGoalForm();
    }

    const rows = GOALS.map(g => {
      const {done, total} = goalProgress(g);
      const catLabel = CATS[g.category] ? CATS[g.category].label : g.category;
      return `
        <div class="manage-row">
          <div class="cat-icon manage-row-icon">${iconFor(g.category)}</div>
          <div class="manage-row-info">
            <strong>${escapeXml(g.title)}</strong>
            <span>${escapeXml(catLabel)} · ${total} waypoint${total===1?'':'s'} · ${done}/${total} done</span>
          </div>
          <div class="manage-row-actions">
            <button class="btn-small" data-action="edit-goal" data-goal="${g.id}">Edit</button>
            <button class="btn-small btn-danger" data-action="delete-goal" data-goal="${g.id}">${TRASH_ICON}</button>
          </div>
        </div>
      `;
    }).join('');

    return `
      <button class="back-link" data-action="go-home">${BACK_ICON} All trails</button>
      <div class="manage-header">
        <h2>Manage Your Trails</h2>
        <p>Create your own goals, add waypoints, or edit and reorder anything already here.</p>
        <button class="pill-btn" data-action="new-goal">${PLUS_ICON} New trail</button>
      </div>
      <div class="manage-list">
        ${rows || `<div class="empty-state">No trails yet. Create your first one.</div>`}
      </div>
    `;
  }

  function renderGoalForm(){
    const isEditing = !!draft.originalId;
    const catOptions = Object.keys(CATS).map(id =>
      `<option value="${id}" ${draft.category===id ? 'selected' : ''}>${escapeXml(CATS[id].label)}</option>`
    ).join('');

    const subgoalRows = draft.subgoals.map((sg, i) => `
      <div class="subgoal-edit-row">
        <span class="subgoal-num">${i+1}</span>
        <input type="text" class="text-input" data-field="subgoal" data-idx="${i}" value="${escapeXml(sg)}" placeholder="Waypoint ${i+1}" />
        <div class="subgoal-edit-actions">
          <button type="button" class="icon-btn" data-action="move-sub-up" data-idx="${i}" ${i===0 ? 'disabled' : ''} aria-label="Move up">${UP_ICON}</button>
          <button type="button" class="icon-btn" data-action="move-sub-down" data-idx="${i}" ${i===draft.subgoals.length-1 ? 'disabled' : ''} aria-label="Move down">${DOWN_ICON}</button>
          <button type="button" class="icon-btn" data-action="remove-sub" data-idx="${i}" ${draft.subgoals.length<=1 ? 'disabled' : ''} aria-label="Remove waypoint">${TRASH_ICON}</button>
        </div>
      </div>
    `).join('');

    const newCatPanel = draft.category === '__new__' ? `
      <div class="new-cat-panel">
        <label class="form-label">New category name
          <input type="text" class="text-input" data-field="newCatLabel" value="${escapeXml(draft.newCatLabel)}" placeholder="e.g. Career" />
        </label>
        <div class="form-label">Icon</div>
        <div class="icon-picker">
          ${ICON_SHAPES.map(s => `
            <button type="button" class="icon-swatch ${draft.newCatShape===s.key ? 'selected' : ''}" data-action="pick-shape" data-shape="${s.key}" aria-label="${s.label}" title="${s.label}">${ICONS[s.key]}</button>
          `).join('')}
        </div>
      </div>
    ` : '';

    return `
      <button class="back-link" data-action="cancel-edit">${BACK_ICON} Back to manage</button>
      <div class="manage-header">
        <h2>${isEditing ? 'Edit Trail' : 'New Trail'}</h2>
        <p>${isEditing ? 'Update the details or waypoints for this trail.' : 'Give your goal a name, a category, and a few waypoints to work toward.'}</p>
      </div>
      <div class="goal-form">
        <label class="form-label">Trail title
          <input type="text" class="text-input" data-field="title" value="${escapeXml(draft.title)}" placeholder="e.g. Learn Pottery" />
        </label>

        <label class="form-label">Category
          <select class="text-input" data-field="category">
            ${catOptions}
            <option value="__new__" ${draft.category==='__new__' ? 'selected' : ''}>+ Add new category…</option>
          </select>
        </label>
        ${newCatPanel}

        <label class="form-label">Short description
          <textarea class="text-input" rows="2" data-field="blurb" placeholder="One sentence about this trail">${escapeXml(draft.blurb)}</textarea>
        </label>

        <label class="form-label">Badge name <span class="form-hint">(earned when the trail is completed)</span>
          <input type="text" class="text-input" data-field="badgeName" value="${escapeXml(draft.badgeName)}" placeholder="e.g. The Potter" />
        </label>

        <div class="form-label">Waypoints</div>
        <div class="subgoal-edit-list">
          ${subgoalRows}
        </div>
        <button type="button" class="btn-small btn-add" data-action="add-sub">${PLUS_ICON} Add waypoint</button>

        <div class="form-actions">
          <button type="button" class="pill-btn" data-action="save-goal">Save trail</button>
          <button type="button" class="back-link" data-action="cancel-edit">Cancel</button>
        </div>
      </div>
    `;
  }

  /* ============ RENDER: BADGES ============ */
  function renderBadges(){
    const meta = earnedMetaBadges();
    const earnedMetaCount = meta.filter(b => b.earned).length;

    const goalBadges = GOALS.map(g => {
      const {done, total} = goalProgress(g);
      const earned = done === total;
      return {
        earned,
        name: g.badgeName,
        desc: `Complete the "${g.title}" trail.`,
        icon: iconFor(g.category)
      };
    });
    const earnedGoalCount = goalBadges.filter(b => b.earned).length;

    function sealHtml(iconSvg, locked){
      return `<div class="seal ${locked ? 'locked' : ''}">${iconSvg}</div>`;
    }

    const metaHtml = meta.map(b => `
      <div class="badge ${b.earned ? '' : 'locked'}">
        ${sealHtml(MARKER_ICON, !b.earned)}
        <span class="badge-name">${b.name}</span>
        <span class="badge-desc">${b.desc}</span>
      </div>
    `).join('');

    const goalHtml = goalBadges.map(b => `
      <div class="badge ${b.earned ? '' : 'locked'}">
        ${sealHtml(b.icon, !b.earned)}
        <span class="badge-name">${escapeXml(b.name)}</span>
        <span class="badge-desc">${escapeXml(b.desc)}</span>
      </div>
    `).join('');

    return `
      <button class="back-link" data-action="go-home">${BACK_ICON} All trails</button>
      <div class="badges-header">
        <h2>Your Badge Collection</h2>
        <p>Milestone seals for the way you travel, and a badge for every trail you finish.</p>
        <span class="badge-count">${earnedMetaCount + earnedGoalCount} / ${meta.length + goalBadges.length} earned</span>
      </div>
      <h3 style="font-size:1rem; font-weight:600; margin:26px 0 4px; color:var(--bark-soft); text-transform:uppercase; letter-spacing:0.08em; font-family:'Archivo',sans-serif;">Journey milestones</h3>
      <div class="badge-grid">${metaHtml}</div>
      <h3 style="font-size:1rem; font-weight:600; margin:34px 0 4px; color:var(--bark-soft); text-transform:uppercase; letter-spacing:0.08em; font-family:'Archivo',sans-serif;">Trail badges</h3>
      <div class="badge-grid">${goalHtml}</div>
      <footer class="note">Badges update automatically as you check off waypoints.</footer>
    `;
  }

  /* ============ MAIN RENDER ============ */
  function render(){
    let body = '';
    if(route.view === 'home') body = renderHome();
    else if(route.view === 'detail') body = renderDetail(route.goalId);
    else if(route.view === 'badges') body = renderBadges();
    else if(route.view === 'manage') body = renderManage();

    app.innerHTML = renderHeader() + body;
  }

  /* ============ EVENTS ============ */
  app.addEventListener('click', (e) => {
    const el = e.target.closest('[data-action]');
    if(!el) return;
    handleAction(el);
  });
  app.addEventListener('keydown', (e) => {
    if(e.key !== 'Enter' && e.key !== ' ') return;
    if(e.target.matches('input, textarea, select')) return; // let typing behave normally
    const el = e.target.closest('[data-action]');
    if(!el) return;
    e.preventDefault();
    handleAction(el);
  });

  // Text/select/textarea edits update the draft in place without a full re-render,
  // so the person doesn't lose their cursor position while typing.
  app.addEventListener('input', (e) => {
    const el = e.target.closest('[data-field]');
    if(!el || !draft) return;
    const field = el.getAttribute('data-field');
    if(field === 'subgoal'){
      const idx = parseInt(el.getAttribute('data-idx'), 10);
      draft.subgoals[idx] = el.value;
    } else {
      draft[field] = el.value;
    }
  });

  app.addEventListener('change', (e) => {
    const el = e.target.closest('[data-field="category"]');
    if(!el || !draft) return;
    draft.category = el.value;
    render();
  });

  function handleAction(el){
    const action = el.getAttribute('data-action');
    if(action === 'go-home'){ go({view:'home', goalId:null}); }
    else if(action === 'go-badges'){ go({view:'badges', goalId:null}); }
    else if(action === 'go-manage'){ go({view:'manage', goalId:null}); }
    else if(action === 'open-goal'){ go({view:'detail', goalId: el.getAttribute('data-goal')}); }
    else if(action === 'filter'){ activeFilter = el.getAttribute('data-cat'); render(); }
    else if(action === 'toggle-sub'){
      const goalId = el.getAttribute('data-goal');
      const idx = parseInt(el.getAttribute('data-idx'), 10);
      state.progress[goalId][idx] = !state.progress[goalId][idx];
      saveState();
      render();
    }
    else if(action === 'new-goal'){ draft = blankDraft(); render(); }
    else if(action === 'edit-goal'){
      const goal = GOALS.find(g => g.id === el.getAttribute('data-goal'));
      if(goal){ draft = draftFromGoal(goal); render(); }
    }
    else if(action === 'cancel-edit'){ draft = null; render(); }
    else if(action === 'delete-goal'){
      const goalId = el.getAttribute('data-goal');
      const goal = GOALS.find(g => g.id === goalId);
      if(goal && window.confirm(`Delete "${goal.title}"? This can't be undone.`)){
        GOALS = GOALS.filter(g => g.id !== goalId);
        delete state.progress[goalId];
        saveGoals();
        saveState();
        render();
      }
    }
    else if(action === 'add-sub'){ draft.subgoals.push(''); render(); }
    else if(action === 'remove-sub'){
      const idx = parseInt(el.getAttribute('data-idx'), 10);
      if(draft.subgoals.length > 1){ draft.subgoals.splice(idx, 1); render(); }
    }
    else if(action === 'move-sub-up'){
      const idx = parseInt(el.getAttribute('data-idx'), 10);
      if(idx > 0){
        [draft.subgoals[idx-1], draft.subgoals[idx]] = [draft.subgoals[idx], draft.subgoals[idx-1]];
        render();
      }
    }
    else if(action === 'move-sub-down'){
      const idx = parseInt(el.getAttribute('data-idx'), 10);
      if(idx < draft.subgoals.length - 1){
        [draft.subgoals[idx+1], draft.subgoals[idx]] = [draft.subgoals[idx], draft.subgoals[idx+1]];
        render();
      }
    }
    else if(action === 'pick-shape'){ draft.newCatShape = el.getAttribute('data-shape'); render(); }
    else if(action === 'save-goal'){ saveGoalFromDraft(); }
  }

  function saveGoalFromDraft(){
    const title = draft.title.trim();
    if(!title){ alert('Give this trail a title first.'); return; }

    const cleanedSubgoals = draft.subgoals.map(s => s.trim()).filter(Boolean);
    if(cleanedSubgoals.length === 0){ alert('Add at least one waypoint.'); return; }

    let category = draft.category;
    if(category === '__new__'){
      const label = draft.newCatLabel.trim();
      if(!label){ alert('Name your new category first.'); return; }
      const newId = uniqueId(slugify(label), Object.keys(CATS));
      CATS = {...CATS, [newId]: {label}};
      customCatShapes = {...customCatShapes, [newId]: draft.newCatShape};
      saveCats();
      category = newId;
    }

    const existingIds = GOALS.map(g => g.id).filter(id => id !== draft.originalId);

    if(draft.originalId){
      // Editing an existing goal — keep its id, resize progress to match new waypoint count.
      const idx = GOALS.findIndex(g => g.id === draft.originalId);
      const oldProgress = state.progress[draft.originalId] || [];
      const newProgress = cleanedSubgoals.map((_, i) => !!oldProgress[i]);
      GOALS[idx] = {
        id: draft.originalId,
        title,
        category,
        badgeName: draft.badgeName.trim() || `The ${title}`,
        blurb: draft.blurb.trim(),
        subgoals: cleanedSubgoals
      };
      state.progress[draft.originalId] = newProgress;
    } else {
      const id = uniqueId(slugify(title), existingIds);
      GOALS.push({
        id,
        title,
        category,
        badgeName: draft.badgeName.trim() || `The ${title}`,
        blurb: draft.blurb.trim(),
        subgoals: cleanedSubgoals
      });
      state.progress[id] = cleanedSubgoals.map(() => false);
    }

    saveGoals();
    saveState();
    draft = null;
    go({view:'manage', goalId:null});
  }

  render();
})();
</script>
</body>
</html>
