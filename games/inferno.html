<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Junior Year: An Inferno</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Special+Elite&family=Patrick+Hand&display=swap');
  :root {
    --ash: #d8cfc0; --dark: #0e0805; --ember: #8b2200; --crimson: #6a1010;
    --flame: #c85000; --gold: #c8900a; --smoke: #5a5050; --dim: #3a2820;
    --green: #2d5a2d; --red: #8a1a1a; --notebook: #1a1208; --ruled: #3a2820;
    --sin-color: #c85000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #060402; font-family: 'Patrick Hand', cursive; color: var(--ash); min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 24px 16px; }

  #game-wrapper { width: 860px; max-width: 100%; display: flex; flex-direction: column; min-height: 96vh; }

  /* NAV */
  #nav-bar { background: #0a0604; border: 3px solid var(--smoke); border-bottom: none; padding: 5px 14px; display: flex; align-items: center; justify-content: space-between; }
  .nav-links { display: flex; gap: 8px; }
  .nav-btn { background: none; border: 1px solid #4a3830; color: var(--smoke); font-family: 'Special Elite', cursive; font-size: 0.72em; padding: 3px 9px; border-radius: 3px; cursor: pointer; letter-spacing: 1px; transition: all 0.2s; text-decoration: none; display: inline-block; white-space: nowrap; }
  .nav-btn:hover { border-color: var(--gold); color: var(--gold); }

  /* TITLE */
  #title-bar { background: var(--dark); border: 3px solid var(--smoke); border-bottom: none; border-top: none; padding: 12px 18px; text-align: center; }
  #title-bar h1 { font-family: 'Cinzel', serif; color: var(--ash); font-size: 1.3em; letter-spacing: 3px; text-shadow: 0 0 20px rgba(200,80,0,0.4); }
  #title-bar .subtitle { color: var(--smoke); font-size: 0.78em; font-family: 'Special Elite', cursive; margin-top: 2px; }

  /* STATS */
  #stats-bar { background: #0a0604; border: 3px solid var(--smoke); border-bottom: none; border-top: none; padding: 8px 14px; display: flex; gap: 8px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
  .stat { display: flex; flex-direction: column; align-items: center; min-width: 60px; flex: 1; }
  .stat-label { font-size: 0.67em; color: #a09080; font-family: 'Special Elite', cursive; letter-spacing: 1px; }
  .stat-bar-outer { width: 100%; height: 8px; background: #050302; border-radius: 4px; border: 1px solid var(--dim); margin: 2px 0; }
  .stat-bar-inner { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
  .stat-val { font-size: 0.7em; color: var(--gold); font-weight: bold; }
  /* Sin meter */
  #sin-panel { display: flex; flex-direction: column; align-items: center; min-width: 54px; }
  .sin-label { font-size: 0.67em; color: #c06040; font-family: 'Special Elite', cursive; letter-spacing: 1px; }
  .sin-bar-outer { width: 100%; height: 8px; background: #050302; border-radius: 4px; border: 1px solid #5a2010; margin: 2px 0; }
  #bar-sin { height: 100%; border-radius: 4px; background: linear-gradient(to right, #8b2200, #ff6000); transition: width 0.5s ease; width: 0%; }
  #val-sin { font-size: 0.7em; color: var(--flame); font-weight: bold; }
  #circle-pill { color: var(--smoke); font-family: 'Special Elite', cursive; font-size: 0.78em; white-space: nowrap; }

  /* LAYOUT with sidebar */
  #content-wrapper { display: flex; flex: 1; border: 3px solid var(--smoke); border-top: none; overflow: hidden; }

  /* RESUME SIDEBAR */
  #resume-sidebar { width: 190px; min-width: 190px; background: #0c0906; border-right: 2px solid var(--dim); display: flex; flex-direction: column; overflow: hidden; }
  #resume-header { background: var(--dim); padding: 8px 10px; font-family: 'Cinzel', serif; font-size: 0.75em; color: var(--gold); letter-spacing: 2px; text-align: center; border-bottom: 1px solid var(--smoke); }
  #resume-body { flex: 1; padding: 10px; overflow-y: auto; font-family: 'Special Elite', cursive; font-size: 0.72em; color: #c0b090; line-height: 1.6; }
  #resume-body::-webkit-scrollbar { width: 4px; }
  #resume-body::-webkit-scrollbar-thumb { background: var(--dim); }
  .resume-section { color: var(--flame); font-size: 0.85em; letter-spacing: 1px; margin: 8px 0 3px; border-bottom: 1px solid var(--dim); padding-bottom: 2px; }
  .resume-line { padding: 2px 0; color: #c0b090; }
  .resume-line.earned { color: #90c880; }
  .resume-line.struck { color: #5a4030; text-decoration: line-through; font-style: italic; }
  .resume-line.embellished { color: var(--flame); font-style: italic; }

  /* MAIN PANEL */
  #main-panel { background: #0e0a06; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .panel-top { background: linear-gradient(to bottom, #3a1808, #0e0a06); height: 14px; border-bottom: 1px solid var(--dim); display: flex; align-items: center; justify-content: center; }
  .panel-top span { font-size: 0.65em; color: #5a3020; letter-spacing: 4px; font-family: 'Special Elite', cursive; }
  #content-area { flex: 1; padding: 18px 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }

  /* CIRCLE BANNER */
  .circle-banner { background: var(--crimson); color: var(--ash); font-family: 'Cinzel', serif; text-align: center; padding: 6px 12px; font-size: 0.95em; letter-spacing: 3px; border: 2px solid var(--ember); margin: -4px -4px 4px; text-shadow: 0 0 10px rgba(200,80,0,0.5); }
  .circle-num { font-family: 'Special Elite', cursive; color: var(--flame); font-size: 0.85em; letter-spacing: 1px; }
  .scenario-title { font-family: 'Cinzel', serif; font-size: 1.1em; color: var(--ash); margin: 2px 0 6px; line-height: 1.3; }
  .dante-quote { background: rgba(139,34,0,0.12); border-left: 4px solid var(--ember); padding: 8px 12px; font-family: 'Special Elite', cursive; font-size: 0.85em; color: #c09060; font-style: italic; margin: 4px 0; }
  .dante-quote .attr { color: var(--flame); font-style: normal; font-size: 0.85em; }
  .scenario-text { font-size: 0.97em; line-height: 1.65; color: #c8bfb0; }
  .sin-tag { display: inline-block; background: var(--crimson); color: #f0c090; font-size: 0.7em; padding: 2px 8px; border-radius: 10px; font-family: 'Special Elite', cursive; letter-spacing: 1px; margin-bottom: 4px; border: 1px solid var(--ember); }
  .major-tag { display: inline-block; background: #1a2a1a; color: #90c880; font-size: 0.7em; padding: 2px 8px; border-radius: 10px; font-family: 'Special Elite', cursive; letter-spacing: 1px; margin-bottom: 4px; margin-left: 5px; }

  /* VIRGIL */
  .virgil-note { background: rgba(139,34,0,0.08); border: 1px dashed var(--ember); border-radius: 4px; padding: 9px 12px; font-size: 0.87em; font-style: italic; color: #a07050; margin: 4px 0; }
  .virgil-note strong { font-style: normal; color: var(--flame); }

  /* CHOICES */
  #choices { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .choice-btn { background: #130c06; color: var(--ash); border: 2px solid var(--dim); padding: 10px 14px; font-family: 'Patrick Hand', cursive; font-size: 0.95em; cursor: pointer; text-align: left; border-radius: 4px; transition: all 0.2s; line-height: 1.4; }
  .choice-btn:hover:not(:disabled) { background: #2a1408; border-color: var(--flame); transform: translateX(3px); }
  .choice-btn:disabled { cursor: default; }
  .choice-btn.sinful { border-color: var(--crimson); }
  .choice-btn.sinful:hover:not(:disabled) { background: #2a0808; border-color: var(--flame); }
  .choice-letter { color: var(--gold); font-weight: bold; margin-right: 6px; font-family: 'Cinzel', serif; }
  .sin-marker { font-size: 0.72em; color: var(--flame); margin-left: 4px; font-family: 'Special Elite', cursive; }

  /* OUTCOME */
  #outcome-panel { background: rgba(139,34,0,0.07); border: 2px solid var(--dim); border-radius: 4px; padding: 12px 14px; font-size: 0.95em; line-height: 1.6; display: none; }
  #outcome-panel.show { display: block; }
  .outcome-good { color: #70b870; font-weight: bold; }
  .outcome-bad { color: var(--flame); font-weight: bold; }
  .stat-change { font-family: 'Special Elite', cursive; font-size: 0.85em; margin-top: 6px; color: #8a7060; }
  .stat-change .plus { color: #70b870; } .stat-change .minus { color: var(--flame); }
  .sin-change { font-family: 'Special Elite', cursive; font-size: 0.8em; color: var(--flame); margin-top: 3px; }
  .resume-update { font-family: 'Special Elite', cursive; font-size: 0.8em; color: var(--gold); margin-top: 4px; border-top: 1px solid var(--dim); padding-top: 4px; }

  /* BUTTONS */
  .big-btn { background: var(--ember); color: var(--ash); border: none; padding: 12px; font-family: 'Cinzel', serif; font-size: 1em; cursor: pointer; border-radius: 4px; width: 100%; margin-top: 8px; letter-spacing: 1px; transition: all 0.2s; }
  .big-btn:hover { background: var(--flame); transform: scale(1.02); }
  .start-btn { background: var(--dark); color: var(--gold); border: 3px solid var(--ember); padding: 12px 36px; font-family: 'Cinzel', serif; font-size: 1.1em; cursor: pointer; border-radius: 4px; letter-spacing: 2px; transition: all 0.2s; margin-top: 8px; }
  .start-btn:hover { background: var(--dim); transform: scale(1.04); }

  /* CARD SELECT */
  .choice-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
  .choice-card { background: #130c06; border: 2px solid var(--dim); border-radius: 6px; padding: 12px; cursor: pointer; transition: all 0.2s; color: var(--ash); }
  .choice-card:hover { background: #2a1408; border-color: var(--flame); transform: translateY(-2px); }
  .choice-card.selected { border-color: var(--gold); background: #2a1408; box-shadow: 0 0 12px rgba(200,80,0,0.3); }
  .cc-icon { font-size: 1.8em; margin-bottom: 4px; }
  .cc-name { font-family: 'Cinzel', serif; font-size: 0.95em; color: var(--gold); margin-bottom: 4px; }
  .cc-desc { font-size: 0.8em; line-height: 1.4; color: #a09080; }
  .cc-effect { font-size: 0.75em; font-family: 'Special Elite', cursive; color: #90c880; margin-top: 6px; }

  /* TUTORIAL */
  .tutorial-card { background: #130c06; border: 2px solid var(--dim); border-radius: 4px; padding: 12px 14px; }
  .tutorial-concept { font-size: 1em; font-weight: bold; color: var(--ash); margin-bottom: 2px; }
  .tutorial-body { font-size: 0.9em; color: #c0b090; line-height: 1.5; }

  /* CHRONICLE */
  .chronicle-para { background: #130c06; border-left: 4px solid var(--ember); padding: 12px 16px; border-radius: 0 4px 4px 0; font-size: 0.92em; line-height: 1.75; color: #c8bfb0; position: relative; font-family: 'Patrick Hand', cursive; }
  .chronicle-para::before { content: attr(data-label); position: absolute; top: -11px; left: 10px; background: var(--ember); color: var(--ash); font-family: 'Special Elite', cursive; font-size: 0.7em; padding: 1px 8px; border-radius: 3px; }
  .journal-section { font-family: 'Cinzel', serif; color: var(--flame); font-size: 1em; margin: 8px 0 4px; border-bottom: 1px solid var(--dim); padding-bottom: 4px; }

  /* SUMMARY */
  .summary-grid { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .summary-card { background: rgba(139,34,0,0.1); border: 2px solid var(--dim); border-radius: 4px; padding: 10px 14px; text-align: center; min-width: 82px; }
  .summary-card .s-label { font-family: 'Special Elite', cursive; font-size: 0.68em; color: #8a7060; }
  .summary-card .s-val { font-family: 'Cinzel', serif; font-size: 1.2em; color: var(--ash); font-weight: bold; }
  .end-title { font-family: 'Cinzel', serif; font-size: 1.7em; color: var(--red); text-align: center; }
  .end-title.win { color: #70b870; }
  .end-wisdom { font-family: 'Special Elite', cursive; font-size: 0.9em; color: #8a7060; font-style: italic; border-top: 1px solid var(--dim); border-bottom: 1px solid var(--dim); padding: 8px; text-align: center; }
  .identity-bar { background: rgba(139,34,0,0.08); border: 1px solid var(--dim); border-radius: 4px; padding: 6px 12px; font-family: 'Special Elite', cursive; font-size: 0.78em; color: #8a7060; display: flex; gap: 14px; flex-wrap: wrap; }
  .identity-bar span { color: var(--ash); }

  /* FINAL RESUME */
  .final-resume { background: #0e0a06; border: 2px solid var(--ember); border-radius: 4px; padding: 14px 16px; font-family: 'Special Elite', cursive; font-size: 0.82em; color: #c0b090; line-height: 1.8; }
  .final-resume .r-name { font-family: 'Cinzel', serif; font-size: 1.1em; color: var(--gold); border-bottom: 1px solid var(--ember); padding-bottom: 4px; margin-bottom: 8px; }
  .final-resume .r-section { color: var(--flame); font-size: 0.85em; letter-spacing: 1px; margin: 10px 0 3px; }
  .final-resume .r-line { padding: 1px 0; }
  .final-resume .r-line.good { color: #90c880; }
  .final-resume .r-line.bad { color: #6a4030; text-decoration: line-through; font-style: italic; }
  .final-resume .r-line.questionable { color: var(--flame); font-style: italic; }

  #content-area::-webkit-scrollbar { width: 5px; }
  #content-area::-webkit-scrollbar-track { background: #0e0a06; }
  #content-area::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 3px; }
  #resume-body::-webkit-scrollbar { width: 3px; }
  #resume-body::-webkit-scrollbar-thumb { background: var(--dim); }

  @media (max-width: 600px) {
    #resume-sidebar { display: none; }
  }
</style>
</head>
<body>
<div id="game-wrapper">
  <div id="nav-bar">
    <div class="nav-links">
      <a class="nav-btn" href="index.html">🌳 Burch Tree</a>
      <a class="nav-btn" href="meditations-on-a-2-8-gpa.html">← Year II</a>
    </div>
    <div class="nav-links">
      <a class="nav-btn" href="the-republic-of-graduation.html">Year IV →</a>
    </div>
  </div>
  <div id="title-bar">
    <h1>JUNIOR YEAR: AN INFERNO</h1>
    <div class="subtitle">Dante Alighieri · Nine Circles · One Academic Year</div>
  </div>
  <div id="stats-bar" style="display:none;">
    <div class="stat"><div class="stat-label">📚 GPA</div><div id="gpa-num" style="font-size:1.1em;color:var(--gold);font-family:'Cinzel',serif;font-weight:bold;">3.5</div></div>
    <div class="stat"><div class="stat-label">⚡ ENERGY</div><div class="stat-bar-outer"><div class="stat-bar-inner" id="bar-energy" style="background:#b08820;width:80%;"></div></div><div class="stat-val" id="val-energy">80</div></div>
    <div class="stat"><div class="stat-label">🎉 SOCIAL</div><div class="stat-bar-outer"><div class="stat-bar-inner" id="bar-social" style="background:#a04050;width:70%;"></div></div><div class="stat-val" id="val-social">70</div></div>
    <div class="stat"><div class="stat-label">💰 MONEY</div><div class="stat-bar-outer"><div class="stat-bar-inner" id="bar-money" style="background:#308050;width:55%;"></div></div><div class="stat-val" id="val-money">55</div></div>
    <div id="sin-panel">
      <div class="sin-label">🔥 SIN</div>
      <div class="sin-bar-outer"><div id="bar-sin"></div></div>
      <div id="val-sin">0</div>
    </div>
    <div id="circle-pill"></div>
  </div>
  <div id="content-wrapper">
    <div id="resume-sidebar">
      <div id="resume-header">📄 RÉSUMÉ</div>
      <div id="resume-body">
        <div id="resume-name" style="font-family:'Cinzel',serif;font-size:0.9em;color:var(--gold);margin-bottom:4px;"></div>
        <div id="resume-major" style="font-size:0.8em;color:#a09080;margin-bottom:8px;"></div>
        <div class="resume-section">EDUCATION</div>
        <div class="resume-line">Junior, GPA: <span id="resume-gpa">3.50</span></div>
        <div class="resume-section">EXPERIENCE</div>
        <div id="resume-experience"><div class="resume-line" style="color:#5a4030;font-style:italic;">Nothing yet.</div></div>
        <div class="resume-section">SKILLS</div>
        <div id="resume-skills"><div class="resume-line" style="color:#5a4030;font-style:italic;">Nothing listed.</div></div>
        <div class="resume-section">ACTIVITIES</div>
        <div id="resume-activities"><div class="resume-line" style="color:#5a4030;font-style:italic;">Nothing listed.</div></div>
      </div>
    </div>
    <div id="main-panel">
      <div class="panel-top"><span>✦ ✦ ✦</span></div>
      <div id="content-area"></div>
    </div>
  </div>
</div>

<script>
// ── STATE ─────────────────────────────────────────────────────────────────────
const S = {
  phase: 'title',
  circleIndex: 0,
  gpa: 3.5, energy: 80, social: 70, money: 55, sin: 0,
  major: null,
  abroadPath: false,
  selectedCard: null,
  _currentScenario: null,
  resume: {
    experience: [],
    skills: [],
    activities: [],
  },
  // chronicle tracking
  circleChoices: {},
};

// ── MAJORS ────────────────────────────────────────────────────────────────────
const MAJORS = [
  { id:'business',    icon:'💼', name:'Business',        desc:'Three years in. The blazers are non-ironic now.',              effect:'Money events favorable. GPA moderate. Resume lines come easier.', mods:{ moneyBonus:5, gpaScale:0.1 } },
  { id:'engineering', icon:'⚙️', name:'Engineering',     desc:'You have seen things in those lab reports.',                   effect:'GPA hardest. Energy costs reduced. Resume is formidable.', mods:{ gpaScale:-0.2, energyDiscount:0.25 } },
  { id:'liberalarts', icon:'🎭', name:'Liberal Arts',     desc:'The thesis looms. You are pretending it doesn\'t.',           effect:'Social bonuses high. GPA flexible. Resume requires creativity.', mods:{ socialBonus:8 } },
  { id:'science',     icon:'🔬', name:'Sciences',         desc:'The lab is your home now. You have snacks in the lab.',       effect:'GPA very hard. Energy drains faster. Resume has real substance.', mods:{ gpaScale:-0.2, energyScale:1.2 } },
  { id:'compsci',     icon:'💻', name:'Computer Science', desc:'Junior year is when it gets genuinely difficult.',            effect:'GPA hard. Money events very favorable. Resume builds fast.', mods:{ gpaScale:-0.1, moneyBonus:10 } },
];

// ── DANTE QUOTES (one per circle, no repeats) ─────────────────────────────────
const DANTE_QUOTES = [
  'Abandon all hope, ye who enter here.',
  'There is no greater sorrow than to recall happiness in times of misery.',
  'The path to paradise begins in hell.',
  'From a little spark may burst a mighty flame.',
  'Consider your origin; you were not born to live like brutes, but to follow virtue and knowledge.',
  'I came to a place where no light shone at all.',
  'In the middle of the journey of our life, I came to myself in a dark wood, for the straight way was lost.',
  'He listens well who takes notes.',
  'Beauty awakens the soul to act.',
];

// ── VIRGIL LINES (between circles) ───────────────────────────────────────────
const VIRGIL_LINES = [
  '"Welcome to Circle Two. Dante had a muse waiting at the end. You have a career fair. Keep moving."',
  '"Circle Three. I lived here for a semester. I still get emails from the clubs I joined."',
  '"Circle Four. The note-hoarders. I knew one once. He got a 4.0. He has no friends. Weigh this."',
  '"Circle Five. Group projects. I have nothing funny to say about group projects. Just go."',
  '"Circle Six. The lies we tell ourselves. I believed I didn\'t need sleep until week eleven. The grade still exists."',
  '"Circle Seven. The burnout. Everyone hits it. The ones who come back from it are the interesting ones."',
  '"Circle Eight. The résumé. I once wrote \'fluent in Mandarin.\' I am not fluent in Mandarin. I do not recommend this."',
  '"Circle Nine. The deepest one. What happens here either ends you or makes you the person who helps the next junior down. Choose."',
];
let virgilIdx = 0;

// ── RESUME HELPERS ────────────────────────────────────────────────────────────
function addResumeLine(section, text, type='earned') {
  S.resume[section].push({ text, type });
  renderResume();
}
function strikeResumeLine(section, text) {
  const item = S.resume[section].find(i => i.text === text);
  if (item) { item.type = 'struck'; renderResume(); }
}
function renderResume() {
  const maj = MAJORS.find(m => m.id === S.major);
  document.getElementById('resume-name').textContent = 'Junior Scholar';
  document.getElementById('resume-major').textContent = maj ? `${maj.icon} ${maj.name} Major` : '';
  document.getElementById('resume-gpa').textContent = gpaStr(S.gpa);
  ['experience','skills','activities'].forEach(sec => {
    const el = document.getElementById('resume-'+sec);
    if (S.resume[sec].length === 0) {
      el.innerHTML = '<div class="resume-line" style="color:#5a4030;font-style:italic;">Nothing listed.</div>';
    } else {
      el.innerHTML = S.resume[sec].map(i =>
        `<div class="resume-line ${i.type}">${i.text}</div>`
      ).join('');
    }
  });
}

// ── CIRCLES ───────────────────────────────────────────────────────────────────
function buildCircles() {
  const maj = MAJORS.find(m => m.id === S.major);
  const mn = maj ? maj.name : 'your major';
  const mi = maj ? maj.icon : '📚';

  return [
    // ── CIRCLE 1: LIMBO ───────────────────────────────────────────────────────
    {
      num: 'I', sin: 'Limbo', title: 'The Declaration',
      quote: DANTE_QUOTES[0],
      tag: `The Undeclared · ${mi} ${mn}`,
      text: buildCircle1Text(maj),
      virgil: null,
      choices: buildCircle1Choices(maj),
      trackKey: 'c1',
    },
    // ── CIRCLE 2: LUST ────────────────────────────────────────────────────────
    {
      num: 'II', sin: 'Lust', title: 'The Pursuit of the Impossible Thing',
      quote: DANTE_QUOTES[1],
      tag: 'The Desire · Choose Your Path',
      text: buildCircle2Text(maj),
      virgil: VIRGIL_LINES[0],
      choices: buildCircle2Choices(maj),
      trackKey: 'c2',
      isBranch: true,
    },
    // ── CIRCLE 3: GLUTTONY ────────────────────────────────────────────────────
    {
      num: 'III', sin: 'Gluttony', title: 'The Overcommitment Spiral',
      quote: DANTE_QUOTES[2],
      tag: 'The Excess · Said Yes to Everything',

// ── HELPERS ───────────────────────────────────────────────────────────────────
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function gpaStr(v){return v.toFixed(2);}
function ca(){return document.getElementById('content-area');}
function clear(){ca().innerHTML='';}

function applyMods(stats) {
  const d = Object.assign({}, stats);
  const maj = MAJORS.find(m=>m.id===S.major);
  if (maj) {
    if (maj.mods.gpaScale && d.gpa)        d.gpa += d.gpa > 0 ? maj.mods.gpaScale : -Math.abs(maj.mods.gpaScale);
    if (maj.mods.moneyBonus && d.money)    d.money = (d.money||0) + maj.mods.moneyBonus;
    if (maj.mods.energyDiscount && d.energy < 0) d.energy = Math.floor(d.energy*(1-maj.mods.energyDiscount));
    if (maj.mods.energyScale && d.energy < 0)    d.energy = Math.round(d.energy*maj.mods.energyScale);
    if (maj.mods.socialBonus && d.social > 0)    d.social = (d.social||0)+maj.mods.socialBonus;
  }
  return d;
}

function updateStats() {
  document.getElementById('stats-bar').style.display = 'flex';
  document.getElementById('gpa-num').textContent = gpaStr(S.gpa);
  ['energy','social','money'].forEach(k=>{
    document.getElementById('bar-'+k).style.width = clamp(S[k],0,100)+'%';
    document.getElementById('val-'+k).textContent = S[k];
  });
  document.getElementById('bar-sin').style.width = clamp(S.sin,0,100)+'%';
  document.getElementById('val-sin').textContent = S.sin;
  document.getElementById('circle-pill').textContent = S.circleIndex < 9 ? `Circle ${['I','II','III','IV','V','VI','VII','VIII','IX'][S.circleIndex]}` : '';
  document.getElementById('resume-gpa').textContent = gpaStr(S.gpa);
}

function identityBar() {
  const maj = MAJORS.find(m=>m.id===S.major);
  if (!maj) return '';
  return `<div class="identity-bar">${maj.icon} <span>${maj.name}</span> &nbsp;·&nbsp; ${S.abroadPath ? '✈️ <span>Abroad Path</span>' : '🏛️ <span>Campus Path</span>'}</div>`;
}

// ── SCREENS ───────────────────────────────────────────────────────────────────
function showTitle() {
  Object.assign(S, { phase:'title', circleIndex:0, gpa:3.5, energy:80, social:70, money:55, sin:0, major:null, abroadPath:false, selectedCard:null, _currentScenario:null, circleChoices:{}, resume:{ experience:[], skills:[], activities:[] } });
  document.getElementById('stats-bar').style.display = 'none';
  document.getElementById('circle-pill').textContent = '';
  clear(); renderResume();
  ca().innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px;text-align:center;">
      <div style="font-size:2.2em;">🔥</div>
      <div style="font-family:'Cinzel',serif;font-size:1.9em;color:var(--ash);line-height:1.2;">JUNIOR YEAR:<br><span style="color:var(--flame);">AN INFERNO</span></div>
      <div style="width:80%;height:2px;background:linear-gradient(to right,transparent,var(--ember),transparent);"></div>
      <div style="font-family:'Special Elite',cursive;color:#8a7060;font-size:0.95em;line-height:1.6;max-width:440px;">"In the middle of the journey of our life, I came to myself in a dark wood, for the straight way was lost."<br><em style="font-size:0.85em;color:var(--smoke);">— Dante Alighieri · Also every junior in November</em></div>
      <div style="font-size:0.9em;color:#a09080;max-width:440px;line-height:1.6;">Junior year is nine circles. You will descend through all of them. A burned-out senior named Virgil will guide you, offering observations that are funny, nihilistic, and occasionally wise. Your résumé will update as you go. Choose well.</div>

    </div>`;
}

// ── CIRCLE ENGINE ─────────────────────────────────────────────────────────────
let CIRCLES = null;

function showCircle() {
  if (!CIRCLES) CIRCLES = buildCircles();
  if (S.circleIndex >= CIRCLES.length) { showWin(); return; }
  const sc = CIRCLES[S.circleIndex];
  S._currentScenario = sc;
  const letters = ['A','B','C','D'];
  const maj = MAJORS.find(m=>m.id===S.major);
  clear();
  const virgilHTML = sc.virgil ? `<div class="virgil-note"><strong>Virgil:</strong> ${sc.virgil}</div>` : '';
  ca().innerHTML = `
    ${identityBar()}
    <div class="circle-num">CIRCLE ${sc.num} · ${sc.sin.toUpperCase()}</div>
    <div class="sin-tag">⚠ ${sc.sin}</div>${maj ? `<div class="major-tag">${maj.icon} ${maj.name}</div>` : ''}
    <div class="scenario-title">${sc.title}</div>
    <div class="dante-quote">"${sc.quote}" <span class="attr">— Dante Alighieri, Inferno</span></div>
    ${virgilHTML}
    <div class="scenario-text" style="white-space:pre-line;">${sc.text}</div>
    <div id="choices">${sc.choices.map((ch,i)=>`
      <button class="choice-btn${ch.sin>0?' sinful':''}" onclick="resolveCircle(${i})" id="ch${i}">
        <span class="choice-letter">${letters[i]}.</span>${ch.text}${ch.sin>0?`<span class="sin-marker">🔥 +${ch.sin} sin</span>`:''}
      </button>`).join('')}
    </div>
    <div id="outcome-panel"></div>
    <button class="big-btn" id="next-btn" style="display:none;" onclick="advanceCircle()">DESCEND FURTHER →</button>`;
}

function resolveCircle(idx) {
  const sc = S._currentScenario;
  const ch = sc.choices[idx];
  document.querySelectorAll('.choice-btn').forEach((b,i)=>{b.disabled=true;b.style.opacity=i===idx?'1':'0.4';});
  document.getElementById('ch'+idx).style.borderColor = '#c85000';

  if (sc.trackKey) S.circleChoices[sc.trackKey] = ch.trackVal || '';
  if (sc.isBranch && ch.isAbroad !== undefined) S.abroadPath = ch.isAbroad;
  if (ch.resumeAction) ch.resumeAction();

  let d = applyMods(ch.stats);
  S.gpa    = clamp(S.gpa    + (d.gpa||0),    0, 4.0);
  S.energy = clamp(S.energy + (d.energy||0),  0, 100);
  S.social = clamp(S.social + (d.social||0),  0, 100);
  S.money  = clamp(S.money  + (d.money||0),   0, 100);
  S.sin    = clamp(S.sin    + (d.sin||0),      0, 100);
  updateStats();
  renderResume();

  const tone = (d.gpa||0) >= 0 && (d.energy||0) >= -10 ? 'outcome-good' : 'outcome-bad';
  const changes = [];
  if (d.gpa)    changes.push(`GPA <span class="${d.gpa>0?'plus':'minus'}">${d.gpa>0?'+':''}${d.gpa.toFixed(1)}</span>`);
  if (d.energy) changes.push(`Energy <span class="${d.energy>0?'plus':'minus'}">${d.energy>0?'+':''}${d.energy}</span>`);
  if (d.social) changes.push(`Social <span class="${d.social>0?'plus':'minus'}">${d.social>0?'+':''}${d.social}</span>`);
  if (d.money)  changes.push(`Money <span class="${d.money>0?'plus':'minus'}">${d.money>0?'+':''}${d.money}</span>`);
  if (d.sin)    changes.push(`Sin 🔥 <span class="minus">+${d.sin}</span>`);

  const resumeNote = ch.resumeAction ? `<div class="resume-update">📄 Résumé updated — check sidebar</div>` : '';
  const op = document.getElementById('outcome-panel');
  op.innerHTML = `<span class="${tone}">${ch.outcome}</span><div class="stat-change">${changes.join(' &nbsp;·&nbsp; ')}</div>${resumeNote}`;
  op.classList.add('show');
  const nextLabel = S.circleIndex >= 8 ? 'EMERGE FROM THE INFERNO →' : 'DESCEND FURTHER →';
  const nb = document.getElementById('next-btn');
  nb.textContent = nextLabel; nb.style.display = 'block';
  op.scrollIntoView({ behavior:'smooth', block:'nearest' });

  if (S.gpa < 2.0 || S.energy <= 0 || S.social <= 0 || S.money <= 0) setTimeout(showGameOver, 1400);
}

function advanceCircle() {
  S.circleIndex++;
  if (S.gpa < 2.0 || S.energy <= 0 || S.social <= 0 || S.money <= 0) { showGameOver(); return; }
  if (S.circleIndex >= 9) { showWin(); return; }
  showCircle();
}

// ── CHRONICLE ─────────────────────────────────────────────────────────────────
function buildChronicle() {
  const maj = MAJORS.find(m=>m.id===S.major);
  const mn = maj ? maj.name : 'undeclared';
  const path = S.abroadPath ? 'a semester abroad that was genuinely transformative, which is annoying because it sounds like a brochure' : 'the internship application circuit, which was brutal and educational in ways no classroom could replicate';
  const c3 = S.circleChoices.c3 || 'navigated the overcommitment spiral through methods the historians are still debating';
  const c5 = S.circleChoices.c5 || 'survived another encounter with Marcus in a group project context';
  const c8 = S.circleChoices.c8 || 'faced the résumé reckoning with results that varied by line item';
  const c9 = S.circleChoices.c9 || 'descended through the ninth circle and emerged with their identity approximately intact';
  const sinWord = S.sin >= 60 ? 'considerable' : S.sin >= 30 ? 'moderate' : 'admirably low';
  const tier = S.gpa >= 3.3 ? 'triumph' : S.gpa >= 2.6 ? 'middling' : 'disaster';

  const STORIES = {
    triumph: [
      `Thus opens the account of a ${mn} junior who descended into the academic Inferno with a résumé, a sin meter, and a guide named Virgil who had seen everything and found most of it darkly amusing. The declaration of major in the first circle landed with the satisfying finality of a door closing behind you — not trapping, but clarifying. The second circle offered the great choice of junior year, and our hero chose ${path}. The descent had begun in earnest.`,
      `The middle circles were the hardest, as the middle always is. Our scholar ${c3}, which Virgil noted with the specific approval he reserved for people who don\'t learn the hard way twice. The fifth circle brought Marcus back — Marcus, eternal and unchanged — and our hero ${c5}. The sin meter read ${sinWord} by the time the eighth circle arrived and the résumé faced its reckoning. They ${c8}. Dante himself, reviewing the record, made a note.`,
      `The ninth circle is the deepest and the coldest, and it is where junior year makes its final demand. Our scholar ${c9}. They emerged from the Inferno with a GPA of ${gpaStr(S.gpa)}, a résumé that told a story, and the specific knowledge that comes only from having been underground for a year and come back. "Beauty awakens the soul to act," Dante wrote. The soul, after junior year, was awake. — The Scorched Historians of the College, Year Three.`,
    ],
    middling: [
      `The record of a ${mn} junior's descent into the academic Inferno is, like most records of the middle circles, a story of adequate navigation under difficult conditions. The major was declared in Circle One with the energy of someone who had made peace with the decision, if not with its implications. The second circle offered the great choice, and our hero chose ${path} — a decision that was either strategic or instinctive, and which the historians are unable to conclusively categorize.`,
      `The descent continued. The overcommitment spiral of Circle Three found our scholar: they ${c3}. Virgil observed this from a middle distance and said something that was technically helpful. Marcus returned in the fifth circle with the punctuality of a bad habit, and our hero ${c5}. The sin meter reached ${sinWord} levels. The eighth circle's résumé reckoning arrived: they ${c8}. The circle did not fully release them but it did not hold them fast.`,
      `The ninth circle is where junior year makes its quietest and most important demand, and here our scholar ${c9}. They emerged with a GPA of ${gpaStr(S.gpa)} and a résumé that reflected the year honestly, which is its own form of achievement. Virgil said, at the exit: "Most people make it out. The interesting question is what they carry." Our hero carried something real. — The Moderately Impressed Historians of the College, Year Three.`,
    ],
    disaster: [
      `The infernal record of a ${mn} junior's descent begins with the declaration of major in Circle One — a moment of commitment that the subsequent eight circles would test with what can only be described as thoroughness. The second circle offered the great fork, and our hero chose ${path}, which was the right call or the wrong one depending on which historian you ask, and the historians remain divided. The sin meter was activated. The descent acquired momentum.`,
      `The middle circles were where the record becomes difficult to read without the specific pity Dante reserved for those who suffer their own natures. The overcommitment spiral found our scholar: they ${c3}. Virgil, who had seen this particular shape of disaster before, made his comment and moved on. Marcus appeared in the fifth circle. Our hero ${c5}. The sin meter climbed. The résumé, in the eighth circle, faced a reckoning that produced results best described as ${S.sin > 50 ? '"creative"' : '"honest"'}.`,
      `The ninth circle. Cold. Our scholar ${c9}. They emerged — and emergence itself, the historians wish to emphasize, is not nothing. A GPA of ${gpaStr(S.gpa)} exits the Inferno alongside a résumé that tells a story, and a sin total of ${S.sin} that Dante would recognize as the record of someone who was genuinely tempted by genuinely difficult circles. "In the middle of the journey of our life," Dante wrote, "I came to myself in a dark wood." The coming-to-oneself part is the point. It happened. Eventually. — The Grimly Hopeful Historians of the College, Year Three.`,
    ],
  };
  return STORIES[tier].map((p,i)=>
    `<div class="chronicle-para" data-label="${['The Upper Circles','The Deep Descent','The Exit'][i]}">${p}</div>`
  ).join('');
}

function buildFinalResume() {
  const maj = MAJORS.find(m=>m.id===S.major);
  const toHTML = (items) => items.length === 0

    : items.map(i=>`<div class="r-line ${i.type==='earned'?'good':i.type==='struck'?'bad':'questionable'}">${i.text}</div>`).join('');
  return `

}

function showGameOver() {
  clear();
  document.getElementById('stats-bar').style.display = 'none';
  let reason = 'Your GPA collapsed below 2.0. Academic probation. Dante did not include an academic probation circle but he would have.';
  if (S.energy <= 0) reason = 'Energy hit zero. The burnout was not managed — it won. The seventh circle claims those who refuse to rest.';
  else if (S.social <= 0) reason = 'Social life collapsed entirely. The ninth circle is cold, but total isolation is colder.';
  else if (S.money <= 0) reason = 'Funds fully depleted. The supply lines failed. Even Dante had Beatrice funding the expedition.';
  ca().innerHTML = `
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:16px;">
      <div style="font-size:2em;">🔥💀</div>
      <div class="end-title">CONSUMED BY THE INFERNO</div>
      <div style="font-size:0.95em;line-height:1.6;max-width:460px;color:#c0b090;">${reason}<br><br>Virgil, surveying the wreckage, says: "This is one of the more common outcomes. It doesn't make it less yours."</div>
      <div class="end-wisdom">"Abandon all hope, ye who enter here."<br><em style="font-size:0.85em;color:var(--smoke);">— Dante · He was talking about the gate · He was also talking about this</em></div>
      <button class="start-btn" onclick="resetAndPlay()">↩ TRY AGAIN</button>
    </div>`;
}

function resetAndPlay() { CIRCLES = null; showTitle(); }
showTitle();
</script>
</body>
